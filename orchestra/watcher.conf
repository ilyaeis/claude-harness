# Orchestra watcher v1 config. Read by watcher.py on each run (no restart needed).
# Wake allowlist: tmux sessions whose master gets WAKE lines. Separate names with spaces.
# All other teams: dry run (events.jsonl only). To enable a team, add its session, e.g.:
#   wake_sessions = orch-harness orch-depth
wake_sessions = *
# "*" = every team with a live master. CHAIN events older than this many minutes are marked fired, not sent (wake=skipped_old).
wake_max_age_min = 60
# Minutes without log growth (and no EXIT) before CHAIN_STALE.
stale_min = 20
# Minimum seconds between two wakes to the same master.
wake_gap_sec = 120
# ssh ConnectTimeout for remote chain hosts.
ssh_timeout_sec = 8
# Registry globs to read in addition to the tmux orch-* teams.
registries = ~/dev/*/.orchestra/registry.json ~/dev/*/*/.orchestra/registry.json
# Kinds that wake EVERY live master-* session (any tmux session), not only wake_sessions.
# CTX_300K/400K/500K: context size of the master (ctx_meter.py). Each fires once per session id.
# Off (dry run, events only) until master-harness turns it on. To enable:
#   wake_kinds_all = CTX_300K CTX_400K CTX_500K
wake_kinds_all = CTX_300K CTX_400K CTX_500K USAGE_RESUME API_RESUME
# USAGE_RESUME / API_RESUME: resume idle sessions after a usage limit or an API error (all live sessions).
# To turn off, remove them from wake_kinds_all.
# Test only: limit CTX events to these session names (empty = all masters).
ctx_names =
# GPU servers that the inbox Teams tab shows even when no team uses them (space-separated). Empty = only hosts from team GPU sets.
gpu_hosts =
# ssh user for nvidia-smi on the GPU servers. Empty = your ssh default.
gpu_ssh_user =
